# SAHA BİZİM — iOS derleme ve App Store Connect'e yükleme
# 'ios-yayin' dalına her gönderimde (veya Actions sekmesinden elle) çalışır.
# Gerekli secret'lar: EXPO_TOKEN, ASC_ISSUER_ID, ASC_KEY_ID, ASC_KEY_P8
name: iOS yayın

on:
  push:
    branches: [ios-yayin]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-yayin
  cancel-in-progress: false

jobs:
  derle:
    runs-on: macos-15-intel
    timeout-minutes: 240
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      EAS_NO_VCS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Secret kontrolü
        run: |
          eksik=""
          for s in EXPO_TOKEN ASC_ISSUER_ID ASC_KEY_ID ASC_KEY_P8; do
            if [ -z "${!s}" ]; then eksik="$eksik $s"; fi
          done
          if [ -n "$eksik" ]; then echo "::error::GitHub'da eksik secret:$eksik"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıklar
        run: |
          npm ci
          pip install pyjwt cryptography requests

      - name: Expo hesabı
        run: npx --yes eas-cli@latest whoami

      - name: Apple imza ve sürüm numarası
        id: imza
        run: python scripts/apple_imza.py

      - name: Yeni sertifikayı depoda sakla
        run: |
          if [ -f .imza-sifreli/YENI ]; then
            rm .imza-sifreli/YENI
            git config user.name "Saha Bizim Derleme"
            git config user.email "actions@users.noreply.github.com"
            git add .imza-sifreli/dagitim.bin
            git commit -m "Şifreli dağıtım sertifikası kaydedildi [skip ci]"
            git push
          fi

      - name: Expo projesini bağla
        run: npx --yes eas-cli@latest init --non-interactive --force

      - name: Xcode sürümü
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16.4*.app 2>/dev/null | head -1 || xcode-select -p)" || true
          xcodebuild -version

      - name: iOS derle (GitHub Mac makinesinde)
        run: |
          set -o pipefail
          npx --yes eas-cli@latest build --platform ios --profile production --local --non-interactive --output "$PWD/SahaBizim.ipa" 2>&1 | tee eas-derleme.log
          ls -la SahaBizim.ipa

      - name: App Store Connect'e yükle
        run: |
          echo "yükleme başlıyor" > eas-gonderim.log
          mkdir -p ~/.appstoreconnect/private_keys imza
          python3 - <<'PY' >> eas-gonderim.log 2>&1
          import os
          p8 = os.environ['ASC_KEY_P8'].strip().replace('\\n', '\n')
          if '-----BEGIN' not in p8:
              p8 = '-----BEGIN PRIVATE KEY-----\n' + p8 + '\n-----END PRIVATE KEY-----'
          p8 = p8.replace('-----BEGIN PRIVATE KEY----- ', '-----BEGIN PRIVATE KEY-----\n').replace(' -----END PRIVATE KEY-----', '\n-----END PRIVATE KEY-----')
          for yol in [os.path.expanduser('~/.appstoreconnect/private_keys/AuthKey_' + os.environ['ASC_KEY_ID'].strip() + '.p8'), 'imza/asc.p8']:
              open(yol, 'w').write(p8 + '\n')
          print('anahtar yazıldı')
          PY
          ls -la SahaBizim.ipa >> eas-gonderim.log 2>&1 || { echo "ipa bulunamadı:" >> eas-gonderim.log; find . -name '*.ipa' -maxdepth 3 >> eas-gonderim.log; exit 1; }
          if xcrun altool --upload-app -f SahaBizim.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" >> eas-gonderim.log 2>&1; then
            echo "altool ile yüklendi" >> eas-gonderim.log
          else
            echo "--- altool başarısız, EAS submit deneniyor ---" >> eas-gonderim.log
            npx --yes eas-cli@latest submit --platform ios --profile production --path SahaBizim.ipa --non-interactive --wait >> eas-gonderim.log 2>&1
          fi
          tail -5 eas-gonderim.log

      - name: Hata özeti
        if: failure()
        run: |
          for f in eas-gonderim.log eas-derleme.log; do
            [ -f "$f" ] || { echo "::error title=$f::dosya yok"; continue; }
            ozet=$(tr '\r' '\n' < "$f" | sed -r 's/\x1B\[[0-9;]*[A-Za-z]//g' | grep -v '^\s*$' | grep -iv 'Executing\|Compiling\|Copying\|Building\|Running script\|Touching\|Processing\|Generating\|Linking\|Signing ' | tail -45 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=$f::$ozet"
          done

      - name: Özet
        run: echo "::notice::Sürüm ${{ steps.imza.outputs.surum }} (derleme ${{ steps.imza.outputs.derleme }}) App Store Connect'e yüklendi. İşlenmesi 10-30 dakika sürer."
