# Android test APK'sı: elle çalıştırılır (Actions > Android APK > Run workflow).
# Kendi telefonunda denemek içindir; Play Store sürümü için ayrı imzalı derleme gerekir.
name: Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Bağımlılıklar ve Android projesi
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
      - name: APK derle (paketlenmiş JS ile, test imzası)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk $GITHUB_WORKSPACE/SahaBizim-test.apk
          ls -la $GITHUB_WORKSPACE/SahaBizim-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SahaBizim-test-apk
          path: SahaBizim-test.apk
